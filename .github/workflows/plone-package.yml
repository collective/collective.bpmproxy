name: collective.bpmproxy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # The package lives under backend/ since the monorepo restructure.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff check
        run: uvx ruff check src ../scripts
      - name: Ruff format
        run: uvx ruff format --check src ../scripts

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check dist/*

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-classic/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-classic
      - name: Build bundles
        run: npm run build
        working-directory: frontend-classic
      # The built bundles are committed (they ship in the sdist), so a stale
      # commit of them has to fail here rather than in someone's browser.
      - name: Built bundles are up to date
        run: git diff --exit-code -- backend/src/collective/bpmproxy/browser/static
