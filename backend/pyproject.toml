[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collective.bpmproxy"
version = "1.0a1"
description = "Minimal Camunda Platform 7 / Operaton integration for Plone"
readme = "README.md"
license = { text = "GPL version 2" }
requires-python = ">=3.10"
authors = [
    { name = "Asko Soukka", email = "asko.soukka@iki.fi" },
]
keywords = ["Python", "Plone", "CMS", "BPMN", "Camunda", "Operaton"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: Addon",
    "Framework :: Plone :: 6.0",
    "Framework :: Plone :: 6.1",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]
dependencies = [
    # Imported directly by this package. Several of these also arrive
    # transitively via Plone, but relying on that means a Plone release that
    # drops one breaks this add-on with an ImportError -- so declare them.
    "borg.localrole",
    "cryptography",
    "generic-camunda-client",
    "plone.api>=1.8.4",
    "plone.app.caching",
    "plone.app.contentrules",
    "plone.app.dexterity",
    "plone.app.portlets",
    "plone.keyring",
    "plone.restapi",
    "plone.schema",
    "plone.stringinterp",
    "pyjwt",
    "python-dateutil",
    "pytz",
    "requests",
    "z3c.jbot",
]

[project.urls]
Homepage = "https://github.com/collective/collective.bpmproxy"
PyPI = "https://pypi.org/project/collective.bpmproxy/"
Source = "https://github.com/collective/collective.bpmproxy"
Tracker = "https://github.com/collective/collective.bpmproxy/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-plone>=0.5.0",
    "zope.pytestlayer",
    "plone.app.testing",
    "plone.testing>=5.0.0",
    "plone.app.contenttypes",
]

[dependency-groups]
dev = [
    "ruff",
    "i18ndude",
]

[tool.uv]
# Pin resolution to Plone's official known-good versions for the 6.1
# release line (https://dist.plone.org/release/6.1-latest/constraints.txt,
# same source tox.ini applies directly), regenerated via `make lock`
# (backend/scripts/update_plone_constraints.py).
# Without this, uv's default "highest" resolution strategy picks
# untested newer releases (e.g. it previously resolved Products.CMFPlone
# 6.2.1 / plone.restapi 10.0.2 instead of the tested 6.1.5 / 9.15.6),
# which is what caused the broken-looking site.
constraint-dependencies = [
