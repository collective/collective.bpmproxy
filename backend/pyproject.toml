[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[project.scripts]
update_locale = "collective.bpmproxy.locales.update:update_locale"

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]
exclude = ["**/node_modules"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "CHANGES.rst",
    "CONTRIBUTORS.rst",
    "LICENSE.GPL",
    "LICENSE.rst",
]

[tool.pytest.ini_options]
testpaths = ["src/collective/bpmproxy/tests"]
addopts = "--strict-markers -m \"not operaton and not renovation\""
markers = [
    "operaton: marks tests that require a live Operaton engine",
    "renovation: marks renovation demo integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
lines-after-imports = 2
no-sections = true
order-by-type = false

[tool.towncrier]
package = "collective.bpmproxy"
package_dir = "src"
directory = "news/"
filename = "CHANGES.rst"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true
