[tox]
envlist =
    py{310,311,312,313}
    lint
requires =
    tox>=4

[testenv]
description = run the test suite against Plone 6.1
constrain_package_deps = true
deps =
    -c https://dist.plone.org/release/6.1-latest/constraints.txt
extras =
    test
commands =
    pytest {posargs}

[testenv:lint]
description = ruff linting and formatting checks
skip_install = true
deps =
    ruff
commands =
    ruff check src
    ruff format --check src
