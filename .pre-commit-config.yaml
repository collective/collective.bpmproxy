repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^backend/src/collective/bpmproxy/browser/static/
      - id: end-of-file-fixer
        exclude: ^backend/src/collective/bpmproxy/browser/static/
      - id: trailing-whitespace
        exclude: ^backend/src/collective/bpmproxy/browser/static/
